<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>Grid Layout</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: Arial;
                font-weight: bold;
            }

            body {
                background-color: black;
                padding: 10px;
            }

            .tela {
                display: grid;
                grid-template-columns: 200px 1fr 1fr 1fr;
                grid-template-rows: 40px 2fr 1.5fr 60px;
                gap: 10px;
                height: calc(100vh - 20px);
            }

            .item {
                display: flex;
                justify-content: center;
                border-radius: 8px;
            }

            .navbar {
                align-items: center;
                grid-column: 1 / -1;
                background-color: #D8B4F8;
            }

            .sidebar {
                grid-row: 2 / -1;
                background-color: #8A2BE2;
            }

            .main {
                grid-column: 2 / -1;
                background-color: #B388EB;
            }

            .content-1 {
                background-color: #9B5DE5;
            }

            .content-2 {
                background-color: #8A2BE2;
            }

            .content-3 {
                background-color: #7B2CBF;
            }

            .footer {
                align-items: center;
                grid-column: 2 / -1;
                background-color: #5A189A;
            }
        </style>
    </head>
    <body>
        <div class="tela">
            <div class="item navbar">NAVBAR</div>
            <div class="item sidebar"><br>SIDEBAR</div>
            <div class="item main"><br>MAIN</div>
            <div class="item content-1"><br>CONTENT 1</div>
            <div class="item content-2"><br>CONTENT 2</div>
            <div class="item content-3"><br>CONTENT 3</div>
            <div class="item footer">FOOTER</div>
        </div>
    </body>
</html>
